name: CI/CD_Github_Actions
on:
  push:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]

jobs:
  Explore-GitHub-Actions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
    
      - name: Build
        run: mvn -B package -DskipTests
 
      - name: Run unit tests
        run: mvn -B test
        